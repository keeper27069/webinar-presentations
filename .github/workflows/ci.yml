name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lessons:
        description: "Lessons to smoke: all, an id, or a comma list of ids/prefixes"
        default: ''
      langs:
        description: "Languages, e.g. uz,ru,en"
        default: 'uz,ru,en'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test (changed lessons, 3 languages)
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha || 'HEAD~1' }}
          LESSONS: ${{ github.event.inputs.lessons }}
          LANGS: ${{ github.event.inputs.langs }}
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          if [ -n "$LESSONS" ]; then
            npm run smoke -- "$LESSONS" --lang="$LANGS" --no-shots
          else
            npm run smoke -- all --since="$BEFORE"
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-screenshots
          path: .smoke
          include-hidden-files: true
          retention-days: 7
